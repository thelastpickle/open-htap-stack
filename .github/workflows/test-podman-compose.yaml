      - name: Test Mission Control dashboard
        run: |
          # Scratch space for the helpers below.  RUNNER_TEMP is always set on a
          # GitHub runner; the fallback lets this step be run by hand.
          export TMP_DIR="${RUNNER_TEMP:-$PWD/.ci-tmp}"
          mkdir -p "$TMP_DIR"

          # Small helpers, so the polling loops below need no nested quoting.
          cat > "$TMP_DIR/jq-path.py" << 'PY'
          # Print one value out of a JSON document on stdin: jq-path.py total_drones
          # Always prints exactly one token, so the polling loops below can compare it
          # even when the endpoint answered with an error instead.
          import json, sys
          try:
              document = json.load(sys.stdin)
              for key in sys.argv[1:]:
                  document = document[key] if isinstance(document, dict) else document[int(key)]
              print(len(document) if isinstance(document, (list, dict)) else document)
          except Exception as error:
              print(0)
              print(f"jq-path: {type(error).__name__}: {error}", file=sys.stderr)
          PY
          cat > "$TMP_DIR/check-benchmark.py" << 'PY'
          # check-benchmark.py <engine that must answer> ...
          #
          # Every engine must be reachable.  Only the engines named on the command
          # line have to answer the query, because not every query is for every
          # engine: CQL cannot group by a non-key column, and the aggregate below
          # relies on it saying so.
          import json, sys
          required = set(sys.argv[1:])
          engines = json.load(sys.stdin)
          problems = []
          for name, result in engines.items():
              if not result["available"]:
                  problems.append(f"{name} unreachable: {result['error']}")
              elif name in required and (result["error"] or result["row_count"] == 0):
                  problems.append(f"{name}: {result['error'] or 'no rows'}")
          if problems:
              print("::error::benchmark failed: " + "; ".join(problems))
              sys.exit(1)
          for name, result in engines.items():
              answered = not result["error"] and result["row_count"]
              print(
                  f"  {name}: {result['query_time_ms']}ms, {result['row_count']} rows"
                  if answered
                  else f"  {name}: declined this query — {result['error']}"
              )
          PY
          # The two presets the dashboard offers.  The bounded read every path can
          # answer; the aggregate is the one CQL cannot express, which is the point
          # of having the other three.
          cat > "$TMP_DIR/benchmark-bounded.json" << 'JSON'
          {"sql": "SELECT entity_id, speed_mps, altitude_m FROM drone_latest_status LIMIT 5", "limit": 5}
          JSON
          cat > "$TMP_DIR/benchmark-aggregate.json" << 'JSON'
          {"sql": "SELECT event_type, count(*) AS event_count, min(temp_internal_c) AS coldest, max(temp_internal_c) AS hottest FROM events GROUP BY event_type ORDER BY event_type LIMIT 5", "limit": 5}
          JSON
          cat > "$TMP_DIR/vector-search.json" << 'JSON'
          {"query": "hydropower and renewable energy", "limit": 3}
          JSON
          cat > "$TMP_DIR/demo-settings.json" << 'JSON'
          {"drones_enabled": 40, "events_per_sec": 800, "outlier_percent": 5.0, "paused": false}
          JSON

          echo -e "\n=== Waiting for the dashboard API ==="
          timeout 180 bash -c 'until curl -sf http://localhost:8000/api/health > /dev/null; do echo "Waiting for backend..."; sleep 5; done'
          echo "✓ Backend is answering"

          echo -e "\n=== Waiting for the dashboard to be served ==="
          timeout 120 bash -c 'until curl -sf http://localhost:4000/ > /dev/null; do echo "Waiting for frontend..."; sleep 5; done'
          # The frontend proxies /api to the backend, so this also proves the proxy resolves.
          curl -sf http://localhost:4000/api/health > /dev/null \
            || { echo "::error::the frontend is not proxying /api to the backend"; exit 1; }
          echo "✓ Dashboard served, and proxying the API"

          echo -e "\n=== Every service reachable from the backend ==="
          curl -s http://localhost:8000/api/platform/health | tee "$TMP_DIR/platform-health.json"
          echo
          grep -q '"status": *"down"' "$TMP_DIR/platform-health.json" \
            && { echo "::error::the backend cannot reach every service"; exit 1; }
          echo "✓ All services reachable"

          echo -e "\n=== KPIs derived from live data ==="
          # The producer and the sink have been running since the earlier steps, so
          # the fleet must be non-empty; a zero here means the dashboard is not
          # reading what the sink wrote.
          timeout 180 bash -c 'while true; do FLEET=$(curl -s http://localhost:8000/api/overview/kpis | python3 $TMP_DIR/jq-path.py total_drones); [ "${FLEET:-0}" -gt 0 ] && break; echo "Waiting for the dashboard to see the fleet..."; sleep 10; done'
          curl -s http://localhost:8000/api/overview/kpis | python3 -m json.tool | head -20
          echo "✓ KPIs populated"

          echo -e "\n=== One bounded read, all four access paths ==="
          # Spark starts a job for its first query, and the bulk reader takes a
          # snapshot before it reads, so allow a generous window.
          curl -s --max-time 600 -X POST http://localhost:8000/api/query/benchmark \
            -H 'Content-Type: application/json' --data @"$TMP_DIR/benchmark-bounded.json" \
            > "$TMP_DIR/bounded-result.json"
          python3 -m json.tool < "$TMP_DIR/bounded-result.json"
          python3 "$TMP_DIR/check-benchmark.py" cassandra presto spark spark_bulk \
            < "$TMP_DIR/bounded-result.json"
          echo "✓ Every access path answered the bounded read"

          echo -e "\n=== Fleet-wide aggregate: the query CQL cannot express ==="
          # Minutes, not seconds: this groups every event ingested so far, on three
          # paths in sequence.  Cassandra is expected to decline it, and the
          # checker is told so.
          curl -s --max-time 1800 -X POST http://localhost:8000/api/query/benchmark \
            -H 'Content-Type: application/json' --data @"$TMP_DIR/benchmark-aggregate.json" \
            > "$TMP_DIR/aggregate-result.json"
          python3 -m json.tool < "$TMP_DIR/aggregate-result.json"
          python3 "$TMP_DIR/check-benchmark.py" presto spark spark_bulk \
            < "$TMP_DIR/aggregate-result.json"
          grep -q "PRIMARY KEY" "$TMP_DIR/aggregate-result.json" \
            || { echo "::error::Cassandra was expected to decline the GROUP BY; it did not"; exit 1; }
          echo "✓ The analytical paths answered the aggregate, and Cassandra explained why it cannot"

          echo -e "\n=== Every snapshot the bulk reader takes is time-bounded ==="
          # A snapshot hard-links live SSTables, so one without an expiry keeps them
          # from being compacted away for ever.  The reader is configured with a TTL
          # that Cassandra enforces, so each of its snapshots must carry an
          # expiration time; listsnapshots prints that in the last column.
          podman exec cassandra nodetool listsnapshots 2>&1 | tail -20
          podman exec cassandra nodetool listsnapshots 2>/dev/null \
            | grep htap_dashboard > "$TMP_DIR/snapshots.txt" || true
          UNBOUNDED=$(awk "{ if (\$NF ~ /^[0-9]{4}-/) next; print }" "$TMP_DIR/snapshots.txt" | wc -l | tr -d " ")
          [ "${UNBOUNDED:-0}" -eq 0 ] \
            || { echo "::error::$UNBOUNDED dashboard snapshots have no expiry"; cat "$TMP_DIR/snapshots.txt"; exit 1; }
          echo "✓ $(wc -l < "$TMP_DIR/snapshots.txt" | tr -d " ") snapshot(s) present, all with an expiry"

          echo -e "\n=== Vector search over Cassandra 5 SAI ==="
          curl -sf -X POST http://localhost:8000/api/vector/index-all \
            || { echo "::error::could not start the vector indexer"; exit 1; }
          # The indexer runs in the background, so poll until a search finds something.
          timeout 300 bash -c 'while true; do HITS=$(curl -s --max-time 120 -X POST http://localhost:8000/api/vector/search -H "Content-Type: application/json" --data @$TMP_DIR/vector-search.json | python3 $TMP_DIR/jq-path.py results); [ "${HITS:-0}" -gt 0 ] && break; echo "Waiting for embeddings..."; sleep 10; done'
          curl -s -X POST http://localhost:8000/api/vector/search \
            -H 'Content-Type: application/json' --data @"$TMP_DIR/vector-search.json" | python3 -m json.tool | head -30
          echo "✓ Vector search returned matches"

          echo -e "\n=== Flight path from the event history ==="
          ENTITY=$(curl -s "http://localhost:8000/api/map/live?limit=1" | python3 "$TMP_DIR/jq-path.py" drones 0 entity_id)
          POINTS=$(curl -s "http://localhost:8000/api/map/drone/$ENTITY/trail?points=10" | python3 "$TMP_DIR/jq-path.py" points)
          echo "$ENTITY has $POINTS recorded positions"
          [ "$POINTS" -gt 1 ] || { echo "::error::no flight path for $ENTITY"; exit 1; }
          echo "✓ Flight path read from drone_events_by_entity"

          echo -e "\n=== Demo controls reach the producer ==="
          curl -sf -X POST http://localhost:8000/api/settings/demo \
            -H 'Content-Type: application/json' --data @"$TMP_DIR/demo-settings.json" \
            || { echo "::error::could not update the demo settings"; exit 1; }
          # The producer polls every 10s, so give it a few cycles to report the change.
          timeout 90 bash -c 'until podman logs data-producer 2>&1 | grep -q "settings updated: eps=800"; do echo "Waiting for the producer to adopt the new settings..."; sleep 5; done'
          echo "✓ The producer adopted the settings set through the dashboard"

          echo "✓ All Mission Control checks passed"
        timeout-minutes: 20

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Tooling ==="
          podman --version
          podman compose version || true

          echo -e "\n=== Containers ==="
          podman ps -a

          for service in kafka cassandra spark presto data-producer data-cassandra-sink; do
            echo -e "\n=== $service logs ==="
            podman logs "$service" || true
          done

      - name: Cleanup
        if: always()
        run: |
          podman compose -f podman-compose.yml down -v
          podman system prune -af --volumes
