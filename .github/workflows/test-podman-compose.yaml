      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Tooling ==="
          podman --version
          podman compose version || true

          echo -e "\n=== Containers ==="
          podman ps -a

          # backend is here because it runs all five access paths, and the reason a path
          # answered oddly is usually one line it printed and nothing else did.  A missing
          # snapshot_bytes cost a dive through the Sidecar's access log to attribute, where
          # "[db] could not size snapshot ... ReadTimeout" would have named it at once.
          for service in kafka cassandra spark presto backend data-producer data-cassandra-sink; do
            echo -e "\n=== $service logs ==="
            podman logs "$service" || true
          done

      - name: Cleanup
        if: always()
        run: |
          podman compose -f podman-compose.yml down -v
          podman system prune -af --volumes
