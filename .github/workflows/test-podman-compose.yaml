name: Test Podman Compose

on:
  push:
  pull_request:
  workflow_dispatch:
  # also test trunk daily (due to many unpinned dependencies)
  schedule:
    - cron: '0 0 * * *'

# cancel same workflows in progress for pull request branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  test-compose:
    # Pinned deliberately: ubuntu-latest changes the preinstalled container tooling
    # without notice, and Ubuntu 26.04 is already in public preview.  This job exists
    # to catch drift in the stack's own dependencies, not in the runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Podman and Podman Compose
        run: |
          # Use the podman the runner image already provides.  Since image
          # 20260810.271 that is a pinned static bundle under /usr/local/bin (podman
          # 5.x plus crun, conmon, netavark, aardvark-dns and pasta), shipped with the
          # /etc/containers drop-ins and the AppArmor profile that rootless podman
          # needs on Ubuntu.  Installing Ubuntu's own podman package on top of it
          # leaves two podman versions sharing one storage root and replaces those
          # drop-ins.  ref https://github.com/actions/runner-images/pull/14412
          command -v podman > /dev/null \
            || { echo "::error::no podman on this runner image; install one here"; exit 1; }
          podman --version
          podman info

          # Ubuntu 24.04 packages podman-compose 1.0.6, which predates podman 5 and
          # ignores the depends_on conditions; take a current release from PyPI.
          pipx install podman-compose==1.6.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"

          # Pin the provider.  podman's lookup otherwise prefers the docker-compose CLI
          # plugin the image also carries, which speaks to a Docker-compatible socket
          # that nothing serves here.  podman-compose shells out to the podman CLI, so
          # one podman owns the containers and podman ps and podman logs can still see
          # what compose created.
          PODMAN_COMPOSE_PROVIDER="$(command -v podman-compose)"
          echo "PODMAN_COMPOSE_PROVIDER=$PODMAN_COMPOSE_PROVIDER" >> $GITHUB_ENV
          export PODMAN_COMPOSE_PROVIDER
          podman compose version

      - name: Build services
        run: |
          # The scheduled run builds without cache on purpose, to exercise the
          # unpinned dependencies the images download.  Those downloads are the least
          # reliable part of the build, so retry; a retry reuses the layers the
          # previous attempt already committed.
          for attempt in 1 2 3; do
            no_cache=""
            if [ "$attempt" = 1 ]; then no_cache="--no-cache"; fi
            if podman compose -f podman-compose.yml build $no_cache; then
              exit 0
            fi
            if [ "$attempt" != 3 ]; then
              echo "::warning::build attempt $attempt failed, retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::podman compose build failed after 3 attempts"
          exit 1
        timeout-minutes: 20

      - name: Create containers
        run: |
          # Clear Ivy resolver metadata that may have stale references
          # Keep the actual jars and ivy.xml files
          find spark/ivy/cache -name "*.properties" -delete || true
          chmod -R 777 cassandra-data spark/ivy

          # Create every container from the compose file, and start none of them.
          # The runner image's podman is a static build with no systemd, so it
          # silently skips scheduling the healthcheck timers and every container
          # stays in "starting" for ever; any compose provider that honours
          # depends_on: condition: service_healthy then waits for ever too.  So the
          # next two steps do the ordering, and wait on the services themselves
          # rather than on podman's opinion of their health.
          podman compose -f podman-compose.yml up -d --no-start
          podman ps -a
        timeout-minutes: 10

      - name: Start Kafka and Cassandra
        run: |
          podman start kafka cassandra

          echo -e "\n=== Waiting for Kafka to be healthy ==="
          timeout 720 bash -c 'until podman exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; do echo "Waiting for Kafka..."; sleep 5; done'
          echo "✓ Kafka is healthy"

          echo -e "\n=== Waiting for Cassandra to be healthy ==="
          timeout 300 bash -c 'until podman exec cassandra cqlsh -e "DESCRIBE KEYSPACES" cassandra 9042 >/dev/null 2>&1; do echo "Waiting for Cassandra..."; sleep 10; done'
          echo "✓ Cassandra is healthy"

          echo -e "\n=== Waiting for Cassandra Sidecar to be healthy ==="
          timeout 120 bash -c 'until curl -sf http://localhost:9043/api/v1/__health >/dev/null 2>&1; do echo "Waiting for Sidecar..."; sleep 5; done'
          echo "✓ Cassandra Sidecar is healthy"
        timeout-minutes: 15

      - name: Start remaining services and verify
        run: |
          # the same order the compose file's depends_on describes: cassandra and
          # kafka are ready by now, so spark, then presto, then the ingress services
          podman start spark presto data-producer data-cassandra-sink

          echo -e "\n=== Waiting for Spark to be ready ==="
          timeout 120 bash -c 'until curl -sf http://localhost:8080 >/dev/null 2>&1; do echo "Waiting for Spark..."; sleep 5; done'
          echo "✓ Spark is ready"

          echo -e "\n=== Waiting for Presto to be ready ==="
          timeout 120 bash -c 'until curl -sf http://localhost:8088/v1/info >/dev/null 2>&1; do echo "Waiting for Presto..."; sleep 5; done'
          echo "✓ Presto is ready"

          echo -e "\n=== All services are healthy ==="
          podman ps

          echo -e "\n=== Checking data-producer is running ==="
          while ! podman ps --filter "name=data-producer" --format "{{.Names}}" | grep -q "data-producer" ; do
            echo "waiting for data-producer to be running…"
            sleep 5
          done
          
          echo -e "\n=== Waiting for data to flow through the system ==="
          sleep 30
          podman compose -f podman-compose.yml logs data-cassandra-sink

          echo -e "\n=== Checking Cassandra for demo data ==="
          timeout 300 bash -c '
            while true; do
              echo "Attempting query: SELECT * FROM demo.events LIMIT 1;"
              RESULT=$(podman exec cassandra cqlsh cassandra -e "SELECT * FROM demo.events LIMIT 1;" 2>&1)
              EXIT_CODE=$?
              echo "$RESULT"
              # Check if result contains a UUID (indicating actual data rows)
              if [ $EXIT_CODE -eq 0 ] && echo "$RESULT" | grep -qE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"; then
                echo "✓ Found events in demo.events table"
                break
              fi
              sleep 10
            done
          '
        timeout-minutes: 12

      - name: Test Presto Queries
        run: |
          echo -e "\n=== Testing Presto Queries ==="
          
          echo "Testing SHOW SCHEMAS..."
          RESULT=$(podman exec presto presto-cli --execute "SHOW SCHEMAS FROM cassandra;" 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ SHOW SCHEMAS failed with exit code $EXIT_CODE"; exit 1; }
          (! echo "$RESULT" | grep -q "demo") && { echo "❌ Expected 'demo' schema not found in results"; exit 1; }
          echo "✓ SHOW SCHEMAS validated"
          
          echo -e "\nTesting SELECT with LIMIT..."
          RESULT=$(podman exec presto presto-cli --execute "SELECT * FROM cassandra.demo.events LIMIT 100;" 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ SELECT query failed with exit code $EXIT_CODE"; exit 1; }
          if ! echo "$RESULT" | grep -qE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"; then
            echo "❌ No data rows found in SELECT results"
            exit 1
          fi
          echo "✓ SELECT query validated with data"
          
          echo -e "\nTesting GROUP BY query..."
          RESULT=$(podman exec presto presto-cli --execute "SELECT entity_id, COUNT(*) FROM cassandra.demo.events GROUP BY entity_id LIMIT 10;" 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ GROUP BY query failed with exit code $EXIT_CODE"; exit 1; }
          (! echo "$RESULT" | grep -qE "[0-9]+") && { echo "❌ No aggregation results found in GROUP BY output"; exit 1; }
          echo "✓ GROUP BY query validated with results"
          
          echo "✓ All Presto queries completed successfully"

      - name: Test SparkSQL Queries - Per-Partition
        run: |
          echo -e "\n=== Testing Per-Partition SparkSQL Queries ==="
          
          # Test per-partition queries using spark-cassandra-connector
          cat > /tmp/spark_partition_test.sql << 'EOF'
          CREATE TEMPORARY VIEW events_for_partition_queries USING org.apache.spark.sql.cassandra
          OPTIONS (keyspace 'demo', table 'events');
          
          SELECT * FROM events_for_partition_queries LIMIT 3;
          EOF
          
          podman cp /tmp/spark_partition_test.sql spark:/tmp/spark_partition_test.sql
          echo "Executing per-partition SparkSQL queries..."
          set +e
          RESULT=$(podman exec spark spark-sql \
            --packages com.datastax.spark:spark-cassandra-connector_2.12:3.5.1 \
            --conf spark.cassandra.connection.host=cassandra \
            -f /tmp/spark_partition_test.sql 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ Per-partition SparkSQL queries failed with exit code $EXIT_CODE"; exit 1; }
          (! echo "$RESULT" | grep -q "Fetched 3 row(s)") && { echo "❌ Query did not return 3 rows as expected"; exit 1; }
          
          echo "✓ Per-partition SparkSQL queries completed successfully"

      - name: Test SparkSQL Queries - Bulk Reader
        run: |
          echo -e "\n=== Testing Bulk SparkSQL Queries ==="
          
          # Test bulk queries using Cassandra Spark Bulk Reader
          cat > /tmp/spark_bulk_test.sql << 'EOF'
          CREATE OR REPLACE TEMP VIEW events_for_bulk_queries
          USING org.apache.cassandra.spark.sparksql.CassandraDataSource
          OPTIONS (
            sidecar_contact_points "cassandra",
            keyspace "demo",
            table "events",
            DC "datacenter1",
            createSnapshot "true",
            snapshotName "htap_demo_sparksql",
            numCores "4"
          );
          
          SELECT count(*) FROM events_for_bulk_queries;
          
          SELECT event_type, COUNT(*) AS cnt, MIN(event_time) AS first_seen, MAX(event_time) AS last_seen
            FROM events_for_bulk_queries GROUP BY event_type ORDER BY cnt DESC LIMIT 10;
          EOF
          
          podman cp /tmp/spark_bulk_test.sql spark:/tmp/spark_bulk_test.sql
          echo "Executing bulk SparkSQL queries..."
          set +e
          RESULT=$(podman exec spark spark-sql \
            --packages org.apache.cassandra:cassandra-analytics-core_spark3_2.12:0.4.0-mck0,org.apache.cassandra:analytics-sidecar-vertx-client-all:0.4.0-mck0,org.apache.cassandra:cassandra-bridge_spark3_2.12:0.4.0-mck0 \
            -f /tmp/spark_bulk_test.sql 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ Bulk SparkSQL queries failed with exit code $EXIT_CODE"; exit 1; }
          (! echo "$RESULT" | grep -qE "[0-9]+") && { echo "❌ Count query did not return a valid number"; exit 1; }
          (! echo "$RESULT" | grep -qE "[a-zA-Z_]+.*[0-9]+") && { echo "❌ GROUP BY query did not return expected aggregation results"; exit 1; }
          
          echo "✓ Bulk SparkSQL queries completed and validated successfully"

      - name: Test Parquet Export
        run: |
          echo -e "\n=== Testing Parquet Export ==="
          
          # Test exporting to Parquet using the bulk reader view
          cat > /tmp/spark_parquet_export.sql << 'EOF'
          CREATE OR REPLACE TEMP VIEW events_for_bulk_queries
          USING org.apache.cassandra.spark.sparksql.CassandraDataSource
          OPTIONS (
            sidecar_contact_points "cassandra",
            keyspace "demo",
            table "events",
            DC "datacenter1",
            createSnapshot "true",
            snapshotName "htap_demo_parquet_export",
            numCores "4"
          );
          
          INSERT OVERWRITE DIRECTORY '/var/lib/cassandra/parquet-exports/demo_events' USING parquet
          SELECT /*+ COALESCE(1) */ * FROM events_for_bulk_queries;
          EOF
          
          podman cp /tmp/spark_parquet_export.sql spark:/tmp/spark_parquet_export.sql
          echo "Executing Parquet export..."
          set +e
          RESULT=$(podman exec spark spark-sql \
            --packages org.apache.cassandra:cassandra-analytics-core_spark3_2.12:0.4.0-mck0,org.apache.cassandra:analytics-sidecar-vertx-client-all:0.4.0-mck0,org.apache.cassandra:cassandra-bridge_spark3_2.12:0.4.0-mck0 \
            -f /tmp/spark_parquet_export.sql 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "$RESULT"
          [ $EXIT_CODE -ne 0 ] && { echo "❌ Parquet export failed with exit code $EXIT_CODE"; exit 1; }
          
          # Verify parquet file was created
          echo "Verifying Parquet file..."
          podman exec cassandra ls -lh /var/lib/cassandra/parquet-exports/demo_events/
          
          # Count parquet files (should be exactly 1 due to COALESCE(1))
          PARQUET_COUNT=$(podman exec cassandra find /var/lib/cassandra/parquet-exports/demo_events/ -name "*.parquet" | wc -l)
          [ "$PARQUET_COUNT" != "1" ] && { echo "❌ Expected exactly 1 Parquet file, found $PARQUET_COUNT"; exit 1; }
          
          # Verify the parquet file is not empty
          PARQUET_FILE=$(podman exec cassandra find /var/lib/cassandra/parquet-exports/demo_events/ -name "*.parquet" -type f)
          PARQUET_SIZE=$(podman exec cassandra stat -f%z "$PARQUET_FILE" 2>/dev/null || podman exec cassandra stat -c%s "$PARQUET_FILE" 2>/dev/null)
          [ "$PARQUET_SIZE" -eq 0 ] && { echo "❌ Parquet file is empty"; exit 1; }
          
          echo "✓ Parquet export completed successfully - 1 file with $PARQUET_SIZE bytes"
      - name: Test Parquet Import via Spark Shell
        run: |
          echo -e "\n=== Testing Parquet Import via Spark Shell ==="
          
          # First, get the count before truncating
          echo "Getting row count before truncate..."
          COUNT_BEFORE=$(podman exec cassandra cqlsh cassandra -e "SELECT COUNT(*) FROM demo.events;" 2>&1 | grep -oE "[0-9]+" | head -1)
          echo "Rows before truncate: $COUNT_BEFORE"
          
          # Stop ingress and truncate the table
          echo "Stopping data-cassandra-sink and truncating demo.events table..."
          # a manual stop, so the restart policy does not bring the sink back
          podman stop data-cassandra-sink
          podman exec cassandra cqlsh cassandra -e "TRUNCATE demo.events;"
          
          # Verify table is empty
          COUNT_AFTER=$(podman exec cassandra cqlsh cassandra -e "SELECT COUNT(*) FROM demo.events;" 2>&1 | grep -oE "[0-9]+" | head -1)
          echo "Rows after truncate: $COUNT_AFTER"
          [ "$COUNT_AFTER" != "0" ] && { echo "❌ Table not empty after truncate"; exit 1; }
          
          # Create Scala script to read Parquet and write back to Cassandra
          cat > /tmp/parquet_import.scala << 'EOF'
          val df = spark.read.parquet("/var/lib/cassandra/parquet-exports/demo_events")
          
          df.write
            .format("org.apache.cassandra.spark.sparksql.CassandraDataSink")
            .option("sidecar_contact_points", "cassandra")
            .option("keyspace", "demo")
            .option("table", "events")
            .option("DC", "datacenter1")
            .option("numCores", "4")
            .mode("append")
            .save()
          EOF
          
          podman cp /tmp/parquet_import.scala spark:/tmp/parquet_import.scala
          echo "Executing Parquet import via spark-shell..."
          set +e
          RESULT=$(podman exec spark spark-shell \
            --packages org.apache.cassandra:cassandra-analytics-core_spark3_2.12:0.4.0-mck0,org.apache.cassandra:analytics-sidecar-vertx-client-all:0.4.0-mck0,org.apache.cassandra:cassandra-bridge_spark3_2.12:0.4.0-mck0 \
            -i /tmp/parquet_import.scala 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "$RESULT"
          
          # Note: This is currently expected to fail per README FIXME
          [ $EXIT_CODE -ne 0 ] && { echo "❌ Parquet import failed with unexpected error (exit code $EXIT_CODE)"; exit 1; }
          # Verify data was imported
          echo "Verifying data was imported..."
          COUNT_FINAL=$(podman exec cassandra cqlsh cassandra -e "SELECT COUNT(*) FROM demo.events;" 2>&1 | grep -oE "[0-9]+" | head -1)
          echo "Rows after import: $COUNT_FINAL"

          # FIXME: This is currently expected to fail per README FIXME
          [ "$COUNT_FINAL" = "0" ] && { echo "❌ No data imported (expected failure for now)"; }
          # [ "$COUNT_FINAL" = "0" ] && { echo "❌ No data imported"; exit 1; }
          
          echo "✓ Parquet import completed successfully - $COUNT_FINAL rows imported"


