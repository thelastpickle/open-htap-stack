# 8001 while the Python backend still holds 8000; the switchover moves this to 8000.
quarkus.http.port=8001
quarkus.http.host=0.0.0.0
# 0 rather than the default 8081, which the Spark container publishes on a developer
# machine here: a test would then fail to bind for a reason the failure does not name.
quarkus.http.test-port=0

# The pydantic models were snake_case and the frontend reads those names.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# What the Python's CORSMiddleware allowed, including the credentials flag it set beside
# a wildcard origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:*}
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true

# FastAPI served its Swagger UI at /docs and served it in every mode.
quarkus.swagger-ui.path=/docs
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Open HTAP Stack: Mission Control API
mp.openapi.extensions.smallrye.info.version=0.1.0

# Every probe target points at a closed port, so the platform probe is deterministic and
# returns at once rather than waiting out its 2-second connect timeout five times. Port 1
# on the loopback interface refuses immediately.
%test.cassandra.host=127.0.0.1
%test.cassandra.port=1
%test.presto.host=127.0.0.1
%test.presto.port=1
%test.spark.ui-host=127.0.0.1
%test.spark.ui-port=1
# The Thrift Server as well as the UI: a probe left on the default host would resolve the name
# `spark` on a developer machine running the stack, and dial the real Thrift Server from a test.
%test.spark.thrift-host=127.0.0.1
%test.spark.thrift-port=1
# And the application UI, which the running-work page reads and the cancel kills jobs through.
%test.spark.app-ui-port=1
%test.kafka.host=127.0.0.1
%test.kafka.port=1
%test.accord-sql.host=127.0.0.1
%test.accord-sql.port=1
