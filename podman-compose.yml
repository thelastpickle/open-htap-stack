name: htap-demo

networks:
  htap-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  kafka-data:


services:

###############################################################################
## Infrastructure Services
###############################################################################

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks: [htap-net]
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # log.dirs has to be set, and the default is the trap.  /var/lib/kafka/data is
      # Confluent's path; apache/kafka defaults log.dirs to /tmp/kafka-logs, so the volume
      # above held 0 bytes while the topics grew inside the container's own writable layer.
      # Measured: 84 GB there, which filled the podman machine's 256 GB disk, killed this
      # container, and left the rest of the stack unable to write.  `podman system df`
      # reports that layer under Containers rather than Local Volumes, which is what made
      # it hard to attribute.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # Two bounds, because a stack left running needs the time one and a laptop with a
      # finite disk needs the size one.  Both were read back from the broker:
      # `kafka-configs.sh --describe --all` reports each as a STATIC_BROKER_CONFIG, so the
      # KAFKA_ prefix does reach server.properties on this image.  log.retention.ms then
      # reads null with no synonym, which is not the hours setting failing; Kafka resolves
      # ms from hours when it uses it.
      #
      # retention.bytes is per partition and it bounds the *closed* segments, so the real
      # ceiling is about twice its face value: log.segment.bytes defaults to the same 1 GiB,
      # a partition therefore holds one closed segment plus the active one, and the retention
      # check runs every 5 minutes.  Measured on a running broker with 3 partitions each of
      # demo-events and cdc-mutations: 1027, 1155 and 1155 MB against 1762, 1870 and 1154 MB,
      # 8.1 GB in the volume.  Read the ceiling as some 12 GiB and not the 6 GiB the face
      # values suggest; lowering log.segment.bytes would tighten it, and has not been tried.
      #
      # Neither bound binds a short run: at 400 events a second, four hours is some
      # 5.8M records.  The time bound is well clear of the publisher lag this stack has been
      # measured to build, which reached about 2.4M records, some 15 minutes at the CDC
      # publish rate; a record deleted before the sink reads it is data lost, so do not
      # lower it to minutes.
      KAFKA_LOG_RETENTION_HOURS: "6"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"

      # KRaft combined mode (single node, no ZooKeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Two listeners:
      # - Internal Docker/Podman network: kafka:19092 (used by other services)
      # - Host: localhost:9092
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Single-node dev-friendly factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1'"]
      interval: 10s
      timeout: 5s
      retries: 30

  apicurio:
    # The schema registry the Sidecar's CDC publisher writes to.  Apicurio rather than
    # cp-schema-registry because every component of this stack is Apache-licensed and the
    # Confluent build is not; Apicurio serves a Confluent-compatible API under
    # /apis/ccompat/v7, which is what KafkaAvroSerializer and the dashboard both speak.
    # Measured against 3.0.13 before it was adopted: a POST to
    # /apis/ccompat/v7/subjects/<subject>/versions answered {"id":1}, and a GET of
    # /apis/ccompat/v7/schemas/ids/1 returned the schema, which is the whole of the contract
    # the Confluent wire format needs.
    image: apicurio/apicurio-registry:3.0.13
    container_name: apicurio
    networks: [htap-net]
    ports:
      - "8085:8080"   # the registry API and its own web UI
    environment:
      # Storage is the image's default in-process H2, so a restart loses the registered
      # schemas.  That costs nothing here: the Sidecar re-registers a schema on its next
      # publish, and the dashboard reads a schema by the id in the record it is decoding.
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  cassandra:
    build:
      context: ./cassandra
    container_name: cassandra
    hostname: cassandra
    networks:
      htap-net:
        ipv4_address: 172.20.0.10
    ports:
      - "9042:9042"
      - "9043:9043"
      # Internode gossip, 7000, is deliberately not published; nothing outside
      # this network needs it on a single-node stack, and on macOS the port is
      # already held by ControlCenter (AirPlay Receiver).
    volumes:
      - ./cassandra-data:/var/lib/cassandra
      - ./cassandra/sidecar.yaml:/config/sidecar.yaml:ro
      - ./cassandra/sidecar-logback.xml:/config/sidecar-logback.xml:ro
    environment:
      CASSANDRA_CLUSTER_NAME: "${CASSANDRA_CLUSTER_NAME:-htap-demo}"
      CASSANDRA_NUM_TOKENS: "${CASSANDRA_NUM_TOKENS:-16}"
      # Which partitioner the whole cluster uses, and whether Accord is on.  Both
      # are here rather than fixed in cassandra/entrypoint.sh because each has to
      # be measured before it is adopted, and a rebuild between runs would put a
      # second change into the comparison.  A partitioner cannot be changed on an
      # existing data directory, so changing either of these needs
      # ./stop-and-clean-data-and-schema.sh first.  Any non-Murmur3 partitioner
      # also forces num_tokens to 1; the entrypoint says why.
      CASSANDRA_PARTITIONER: "${CASSANDRA_PARTITIONER:-org.apache.cassandra.dht.Murmur3Partitioner}"
      CASSANDRA_ACCORD_ENABLED: "${CASSANDRA_ACCORD_ENABLED:-true}"
      # Change Data Capture.  The Sidecar in this container reads the commit log segments
      # Cassandra hard-links into cdc_raw and publishes one table's mutations to Kafka; the
      # sink owns which table that is.  Off here disables the cassandra.yaml keys and the
      # config seed both, so the node runs as it did before CDC existed.
      #
      # cdc_total_space bounds cdc_raw, and so bounds how far behind the publisher may fall
      # before a mutation is deleted unpublished.  One table opts into CDC but every table's
      # mutations pass through the same commit log, so the directory fills at the node's whole
      # write rate: measured from the segments' mtimes, 4 to 10 segments of 32 MiB a minute,
      # median 7, which is about 18 minutes to fill 4 GiB.  An earlier comment here said two
      # minutes, which was an estimate and was an order of magnitude wrong.
      #
      # cassandra/entrypoint.sh sets cdc_block_writes false, so the node deletes the oldest
      # segments rather than refusing the write when the bound is reached.
      CASSANDRA_CDC_ENABLED: "${CASSANDRA_CDC_ENABLED:-true}"
      CASSANDRA_CDC_TOTAL_SPACE: "${CASSANDRA_CDC_TOTAL_SPACE:-4096MiB}"
      # The segment is the unit the Sidecar's CDC reader buffers in heap, so it is also the lever
      # a heap failure invites; entrypoint.sh records why 8MiB was measured and rejected.  It is
      # here so the sweep can be repeated without editing the entrypoint, and it is set to the
      # release's own default so that setting it changes nothing by itself.
      #
      # CASSANDRA_CDC_ENABLED=false is also the recovery for a node that will not replay its
      # commit log; the stack skill has it.
      CASSANDRA_COMMITLOG_SEGMENT_SIZE: "${CASSANDRA_COMMITLOG_SEGMENT_SIZE:-32MiB}"
      # Where the published mutations go, and where their Avro schemas are registered.  The
      # backend reads the same three values, because a topic or a registry the two disagree on
      # is a Streaming page that shows nothing.
      CDC_TOPIC: "${DEMO_CDC_TOPIC:-cdc-mutations}"
      CDC_KAFKA_BOOTSTRAP: "kafka:19092"
      CDC_SCHEMA_REGISTRY_URL: "http://apicurio:8080/apis/ccompat/v7"
      # JVM heap settings to prevent OOM kills
      MAX_HEAP_SIZE: "${CASSANDRA_MAX_HEAP_SIZE:-4G}"
    # Container memory limits (should be higher than MAX_HEAP_SIZE to account for off-heap memory)
    mem_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    memswap_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cqlsh -e \"DESCRIBE KEYSPACES\" cassandra 9042 && curl -f http://localhost:9043/api/v1/__health'>/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  spark:
    # Spark stays on 3.5 because spark-cassandra-connector publishes nothing above 3.5.1,
    # for either Scala version, so Spark 4 would take the spark access path with it.
    # cassandra-analytics is not the blocker: CASSANALYTICS-34 is fixed for 0.5, and the
    # 0.5-mck0 build below publishes _spark3_2.12 artifacts as well as _spark4_2.13 ones.
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu

    container_name: spark
    hostname: spark
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Spark master UI
      - "8081:8081"   # Spark worker UI
      - "4040:4040"   # First Spark app UI
      - "10000:10000" # Spark Thrift Server (HiveServer2)
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # There is no ivysettings.xml mount: nothing sets spark.jars.ivySettings, so Spark
      # never read one.  The mount that used to be here named a file that was never
      # committed, and podman created an empty directory in its place on every run.
      - ./spark/install-cassandra-libraries.sh:/opt/spark/install-cassandra-libraries.sh:ro
      - ./spark/jobs:/opt/spark/jobs:rw
      - ./cassandra-data:/var/lib/cassandra
      - ./spark/ivy:/opt/spark/work-dir/.ivy2:rw
    environment:
      # Set home directory for Ivy cache (needed for --packages)
      HOME: "/opt/spark/work-dir"
      # The image's own PATH with /opt/spark/bin in front, written out rather than
      # referring to ${PATH}: compose substitutes the *host* shell's PATH there, not
      # the container's.  On a Windows host that is a list of C:\... entries with no
      # /bin, so the runtime could not resolve the `bash` this service's command
      # names and the container exited 127 with "exec: bash: not found".  Reproduced
      # on this image by passing a Windows-shaped PATH, and the value below then
      # resolves bash, java, spark-submit, nproc, wget and sha1sum, which is every
      # binary the command block calls.  It worked on macOS and Linux only because
      # a host PATH there happens to contain /usr/bin and /bin.
      PATH: "/opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      # The CQL connector and the Analytics bulk reader, resolved through the Ivy
      # repository this repository vendors.  Same coordinates as the CI SparkSQL tests.
      # 0.5-mck0 is a local build, not a release; scripts/vendor-analytics.sh made it and
      # spark/ivy/README.md says how.  All three analytics coordinates move together:
      # CassandraDataSource validates a bridge for every implemented version at load, so a
      # 0.4.0 jar beside a 0.5-mck0 one throws "Missing Cassandra implementation for
      # version SIXZERO" rather than degrading.
      CASSANDRA_SPARK_PACKAGES: >-
        com.datastax.spark:spark-cassandra-connector_2.12:3.5.1,
        org.apache.cassandra:cassandra-analytics-core_spark3_2.12:0.5-mck0,
        org.apache.cassandra:analytics-sidecar-vertx-client-all:0.5-mck0,
        org.apache.cassandra:cassandra-bridge_spark3_2.12:0.5-mck0
    command: >
      bash -lc '
        set -euo pipefail;

        echo "Installing Cassandra-compatible JNA with native libraries…";
        wget -q -O /opt/spark/jars/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar;
        echo "1200e7ebeedbe0d10062093f32925a912020e747  /opt/spark/jars/jna.jar" | sha1sum -c - || (echo "SHA1 verification failed!" && exit 1);
        echo "JNA installed and verified successfully";

        echo "Replacing guava-14.0.1.jar with guava-16.0.1…";
        wget -q -O /opt/spark/jars/guava-16.0.1.jar https://repo1.maven.org/maven2/com/google/guava/guava/16.0.1/guava-16.0.1.jar;
        echo "5fa98cd1a63c99a44dd8d3b77e4762b066a5d0c5  /opt/spark/jars/guava-16.0.1.jar" | sha1sum -c - || echo "SHA1 verification failed!";
        rm -f /opt/spark/jars/guava-14.0.1.jar;
        echo "Guava upgraded to 16.0.1 successfully";

        # Put the Cassandra libraries where every classloader in this container can
        # see them.  See spark/install-cassandra-libraries.sh for why the Thrift
        # Server needs that and a one-shot spark-submit does not.
        # Doubled dollar so compose leaves the expansion to the shell.
        /opt/spark/install-cassandra-libraries.sh "$${CASSANDRA_SPARK_PACKAGES}";

        /opt/spark/sbin/start-master.sh --host spark;
        /opt/spark/sbin/start-worker.sh spark://spark:7077;

        # Thrift Server, so the dashboard can run SparkSQL over Cassandra by either
        # path: the CQL connector, and the Analytics bulk reader that reads SSTables
        # directly through the Sidecar.  Both are already on the system classpath by
        # now, so no --packages here: resolving them again would put a second copy
        # on the application classloader.  NOSASL keeps the wire protocol plain, so
        # clients need no SASL library.
        #
        # Two things keep this long-lived server from monopolising the cluster it
        # shares.  Its Derby metastore is its own, because Derby admits one JVM at a
        # time and a server holding the default one would stop anybody running
        # spark-sql in this container, which the CI does.  And spark.cores.max caps
        # what it takes from the worker: a standalone application otherwise holds
        # every core for its lifetime, and the next job to arrive waits for ever
        # with "Initial job has not accepted any resources".  Half the cores, not a
        # fixed two: a fixed cap silently throttles the analytical paths on any host
        # bigger than the smallest one, and measured here a hard 2 made the same
        # aggregate take 130s where half the box took 53s.  The long keepAlive holds the Cassandra
        # session of the connector open between queries: the dashboard queries in
        # bursts, and rebuilding a driver session per burst would cost time and add
        # a failure mode for nothing.
        # Two things to mind when editing this block, both of which fail quietly.
        # It is one single-quoted shell string, so an apostrophe anywhere in it,
        # comments included, ends the string and truncates the script.  And compose
        # interpolates a dollar-brace reference anywhere in this file, comments
        # included, so a variable meant for the shell needs its dollar doubled.
        # A core here is a concurrent task, and a bulk-reader task spends most of
        # its life waiting on the Sidecar rather than computing: measured on a
        # seven-core laptop, this container sat at a tenth of a core while its tasks
        # streamed.  So the cap sets how many streams there are, and half the box
        # left most of the throughput unused: the same scan of the whole history
        # took 443s on three cores and 348s on five.  Leave two cores for everything
        # else instead, and fall back to half on a small host so a four-core CI
        # runner still keeps two for the spark-sql jobs it runs beside this server.
        if [ "$$(nproc)" -gt 4 ]; then THRIFT_CORES=$$(( $$(nproc) - 2 ));
        else THRIFT_CORES=$$(( $$(nproc) / 2 )); fi;
        if [ "$${THRIFT_CORES}" -lt 2 ]; then THRIFT_CORES=2; fi;
        echo "Starting the Spark Thrift Server on 10000, with $${THRIFT_CORES} of $$(nproc) cores…";
        /opt/spark/sbin/start-thriftserver.sh --master spark://spark:7077 --hiveconf "javax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/tmp/thriftserver-metastore;create=true" --hiveconf hive.server2.authentication=NOSASL --hiveconf hive.server2.thrift.port=10000 --hiveconf hive.server2.thrift.bind.host=0.0.0.0 --conf spark.cassandra.connection.host=cassandra --conf spark.cassandra.connection.port=9042 --conf "spark.cores.max=$${THRIFT_CORES}" --conf "spark.executor.cores=$${THRIFT_CORES}" --conf spark.cassandra.connection.keepAliveMS=3600000;

        tail -F /opt/spark/logs/* || tail -f /dev/null
      '
    # tips for debugging: check /opt/spark/work/*/*/stderr

  presto:
    image: prestodb/presto:0.298.1
    container_name: presto
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
      spark:
        condition: service_started
    ports:
      - "8088:8080" # PrestoDB UI
    volumes:
      - ./presto/etc:/opt/presto-server/etc:ro
      # Placeholder for your custom Sidecar/SSTable connector plugin JAR(s)
      #- ./presto/plugin/sstable:/opt/presto-server/plugin/sstable:rw

  # GEICO's cassandra-sql: Postgres-dialect SQL with serializable transactions,
  # over Cassandra used as an ordered key-value store.  It is not a sixth access
  # path to demo.events: it holds its own encoding in its own keyspaces and cannot
  # read a table the sink wrote, so it is absent from the five-path comparison and
  # has its own page.
  #
  # Its README asks for ByteOrderedPartitioner, and this stack runs Murmur3.  That
  # is deliberate and it was checked rather than assumed.  No file under the
  # project's src/main/ reads the partitioner; the only mention is a comment above
  # its one range scan, "SELECT ... FROM kv_store WHERE key >= ? AND key <= ?
  # ALLOW FILTERING".  Measured against this node on a table with that key, and
  # again on one declared transactional_mode='full': the statement is legal, and
  # it returns the right rows.  What differs is their order, token order rather
  # than key order, and cassandra-sql does not use it -- KvStore.scan returns a
  # HashMap's values, and KvQueryExecutor sorts ORDER BY in Java, widening its
  # scan limit when one is present for that very reason.  The cost of Murmur3 is
  # that the scan filters over the whole kv_store table rather than seeking a
  # contiguous range; how much BOP would save there is unmeasured, and Phase 0
  # established that BOP costs this stack two access paths and the vector index.
  accord-sql:
    build:
      context: ./accord-sql
    container_name: accord-sql
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      # 5432 only.  The project also serves /api/sql/health on 8080, which the
      # backend reaches inside the network, but 8080 on the host is the Spark
      # master UI.
      #
      # Only the host side moves.  The container side is a private static final in
      # the service's PostgresProtocolServer, whatever its README implies, and the
      # backend addresses it inside the network; so ACCORD_SQL_PORT is for a host
      # that already runs Postgres on 5432, which is the collision an attendee is
      # most likely to have.  The variable was in .env and read by nothing.
      - "${ACCORD_SQL_PORT:-5432}:5432"
    environment:
      CASSANDRA_CONTACT_POINTS: "cassandra"
      CASSANDRA_PORT: "9042"
      CASSANDRA_LOCAL_DATACENTER: "datacenter1"
      # Three keyspaces, not one: this names the default, and KeyspaceConfig
      # hard-codes cassandra_sql_internal and pg_catalog beside it.  All three are
      # created by cassandra-sql itself, so they are the only part of the schema
      # the sink does not own.
      CASSANDRA_KEYSPACE: "cassandra_sql"
      # kv is the project's own recommendation and the only mode with transactions.
      # The alternative, schema mode, reads native Cassandra tables but has, in the
      # project's words, "No transactions", "No JOINs or subqueries" and "Eventual
      # consistency only", which is weaker than the Presto path already here.  Set
      # here rather than left alone: CassandraSqlConfig.java:13 initialises the
      # field to SCHEMA, and only the bundled application.yml overrides it, so an
      # explicit value is what makes the mode a decision rather than a default.
      CASSANDRA_SQL_STORAGE_MODE: "kv"
      # Spring Boot's own name for the logger, not the project's.  Its
      # application.yml offers CASSANDRA_SQL_LOG_LEVEL, but no file under src/main/
      # calls System.getenv, so that variable is read by nothing.
      LOGGING_LEVEL_COM_GEICO_POC_CASSANDRASQL: "${ACCORD_SQL_LOG_LEVEL:-INFO}"
    # Well above the JVM's -Xmx1g, for the Netty direct buffers behind the
    # Postgres listener and for Calcite's planner.
    mem_limit: "${ACCORD_SQL_MEM_LIMIT:-2g}"
    # This policy only reaches a failed start because the image's entrypoint makes
    # the container exit when nothing opens 5432; a failed Spring context does not
    # stop the JVM by itself, and podman then sees a running container with
    # Restarts=0.  ACCORD_SQL_STARTUP_TIMEOUT_S sets that window, default 300.
    restart: unless-stopped


###############################################################################
## Demo Application Services
###############################################################################

  data-producer:
    build:
      context: ./ingress/producer
    container_name: data-producer
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      # Starting fleet size and rate.  The dashboard's Settings page can change
      # both at runtime, up to MAX_ENTITIES and up to 5,000 a second.
      #
      # Five a second is a trickle, and that is the point: the rate the docs'
      # figures were taken at, 2,000, is the rate a stack left running fills a
      # disk at.  Two colleagues' laptops died to it after half an hour, and the
      # bounds that are supposed to stop that are all further downstream than the
      # generator: Kafka's retention holds some 12 GiB, cdc_raw holds 4 GiB, and
      # Cassandra's own data directory has no bound at all.  So the demo starts
      # slow and is turned up on the Settings page for the run it is being shown
      # in, rather than starting fast and hoping somebody stops it.
      #
      # CI needs the volume its assertions are written against, so
      # .github/workflows/test-podman-compose.yaml sets DEMO_EVENTS_PER_SEC in
      # the job's environment; a shell variable beats the .env file beside this.
      N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-5}"
      OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      PRODUCER_CLIENT_ID: "demo-producer"
      # Live demo controls.  Unset this to ignore the dashboard entirely.
      SETTINGS_URL: "http://backend:8000/api/settings/demo"
      SETTINGS_POLL_INTERVAL_S: "${DEMO_SETTINGS_POLL_INTERVAL_S:-10}"
    restart: unless-stopped

  data-cassandra-sink:
    build:
      context: ./ingress/consumer
    container_name: data-cassandra-sink
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      GROUP_ID: "${DEMO_GROUP_ID:-demo-cassandra-sink}"
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      TABLE: "${DEMO_TABLE:-events}"
      BATCH_SIZE: "${DEMO_BATCH_SIZE:-200}"
      # How events are partitioned.  Declared once here because the dashboard's
      # backend has to name the same buckets and shards when it queries them; the
      # two reading different values would produce queries that match nothing.
      EVENT_BUCKET_MINUTES: "${DEMO_EVENT_BUCKET_MINUTES:-15}"
      EVENT_SHARDS: "${DEMO_EVENT_SHARDS:-16}"
      # The sink owns the schema, so it is the sink that opts the three session
      # tables into Accord.  Read from the same declaration the cassandra service
      # reads above, because the node refuses transactional_mode='full' at CREATE
      # TABLE when the subsystem is off, and the two disagreeing would stop the
      # sink at its schema step.  See ensure_schema in consumer.py.
      CASSANDRA_ACCORD_ENABLED: "${CASSANDRA_ACCORD_ENABLED:-true}"
      # And it is the sink that opts drone_latest_status into CDC, for the same reason: the
      # table's options are written where the table is created.  Read from the declaration
      # the cassandra service reads, so that turning CDC off leaves no table asking a
      # publisher that is not running to follow it.
      CASSANDRA_CDC_ENABLED: "${CASSANDRA_CDC_ENABLED:-true}"
    restart: unless-stopped


###############################################################################
## Mission Control dashboard
##
## The dashboard is the demo's front end: one API over all five access paths, and a
## web UI on top of it.  Nothing else in the stack depends on either service, so
## both can be stopped without affecting ingest.
###############################################################################

  backend:
    build:
      context: ./backend
    container_name: backend
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      # REST API and OpenAPI docs at /docs.  Only the host side moves: the
      # frontend's nginx proxies /api to http://backend:8000, the producer reads
      # its settings from http://backend:8000/api/settings/demo, and the
      # healthcheck curls localhost:8000 inside the container, so all three are
      # indifferent to this.  What does follow the variable is a host-side
      # caller: scripts/cqlite-memsample.sh, and `npm run dev`, whose Vite proxy
      # already has VITE_API_PROXY for the same purpose.
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # The cqlite path parses these files in place, with no snapshot and no
      # Sidecar.  Read-only because a reader must never be able to corrupt the
      # dataset the other four paths are reading; Cassandra mounts the same host
      # directory read-write, and the spark service mounts it too.
      - ./cassandra-data:/var/lib/cassandra:ro
    # The cqlite path reads SSTable files in this process, so a query's memory is
    # this container's memory.  Measured here, the kernel killed uvicorn three
    # times in one afternoon at 11.1 to 11.9 GB anonymous resident, once
    # mid-query, so that query never answered; the cause was cqlite's seek path
    # holding every row of the partitions a query named, and it is bounded now
    # (see cqlite_key_chunk in backend/app/config.py).  The limit stays because a
    # global out-of-memory event lets the kernel choose its victim, and it may
    # choose Cassandra, which is the one process every access path reads through.
    # A limit confines the kill to the container that earned it, and compose
    # restarts it.  It has done so since: raising CQLITE_KEY_CHUNK to 16 and
    # counting one window twice crossed 8 GB on the second statement, and the
    # container came back in seconds.  That was 1.78M rows on Cassandra 5.0 "da"
    # files; the same setting over 1.25M rows of 6.0 "ea" files held 4.84 GB and
    # was not killed, so what reaches the limit is the row count and the repeat
    # rather than the file version.  Mind that the limit also counts the page
    # cache of the files a read touches, 4.19 GB for a walk of the whole table,
    # so it cannot be set from the anonymous figure alone; the kernel reclaims
    # those pages rather than killing for them.
    mem_limit: "${BACKEND_MEM_LIMIT:-8g}"
    memswap_limit: "${BACKEND_MEM_LIMIT:-8g}"
    environment:
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      # Which command the Health page's copyable restart and log commands name.  podman
      # here; a workshop attendee runs docker, and a dashboard handing them a command
      # their machine does not have is the one failure they cannot diagnose.
      CONTAINER_CLI: "${CONTAINER_CLI:-podman}"
      # The same two values the sink writes with, so the window the compare page
      # offers names partitions that exist.
      EVENT_BUCKET_MINUTES: "${DEMO_EVENT_BUCKET_MINUTES:-15}"
      EVENT_SHARDS: "${DEMO_EVENT_SHARDS:-16}"
      PRESTO_HOST: "presto"
      PRESTO_PORT: "8080"
      SPARK_THRIFT_HOST: "spark"
      SPARK_THRIFT_PORT: "10000"
      KAFKA_HOST: "kafka"
      KAFKA_PORT: "19092"
      # The same topic and group the sink above is given.  The window's settled flag
      # reads the sink's committed offsets under this group: whether a closed window
      # can still grow is a question about the writer's position, and Kafka is where
      # that position is recorded.  Naming a different group would read no offsets
      # and report every window unsettled.
      EVENTS_TOPIC: "${DEMO_TOPIC:-demo-events}"
      SINK_GROUP_ID: "${DEMO_GROUP_ID:-demo-cassandra-sink}"
      # The CDC topic the Sidecar publishes to, and the registry that holds the Avro schema
      # each record names.  The Streaming page tails the topic through the backend; the buffer
      # is bounded, so a page nobody is watching costs one consumer and a fixed slice of
      # memory.  Same three values the cassandra service seeds into the Sidecar's config.
      CDC_TOPIC: "${DEMO_CDC_TOPIC:-cdc-mutations}"
      CDC_SCHEMA_REGISTRY_URL: "http://apicurio:8080/apis/ccompat/v7"
      CDC_BUFFER_SIZE: "${DEMO_CDC_BUFFER_SIZE:-200}"
      SPARK_UI_HOST: "spark"
      SPARK_UI_PORT: "8080"
      # Where the cqlite reader looks for the keyspace directories.  Stated here
      # rather than left to the backend's default, because it and the read-only
      # mount above are one setting: the two disagreeing gives a path that finds
      # no table directory and reports every query as a decline.
      CQLITE_DATA_DIR: "/var/lib/cassandra/data"
      # How many token-ring slices a scan with no WHERE divides into.  One, and
      # reachable from here so the split can be exercised without a rebuild: the
      # reader applies the token bound itself, because cqlite's BTI route drops
      # it, and that is worth being able to check.  Raising it multiplies memory
      # rather than throughput; see backend/app/config.py for the measured
      # figure that keeps it at one.
      CQLITE_SPLITS: "${CQLITE_SPLITS:-1}"
      # How many of the partitions a query names are read at a time.  Here for
      # the same reason as the setting above: the memory this bounds is what
      # killed uvicorn before it existed, so being able to raise it and watch
      # that happen again, without a rebuild, is the point.
      CQLITE_KEY_CHUNK: "${CQLITE_KEY_CHUNK:-1}"
      # Shown as the startup defaults on the Settings page, so they must match
      # what data-producer above was started with.
      DEMO_N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      DEMO_MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      DEMO_EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-5}"
      DEMO_OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      # Whether the vector index follows the snippets the sink writes, and how
      # often.  Off at startup: the Explore page turns it on, and the reason to
      # turn it on there is to watch the point read on the Health page stay where
      # it was while the embedder works, which is not visible if it was already
      # running.  The loop reads the snippets after the sink has written them, so
      # nothing in the write path waits for an embedding.
      VECTOR_LIVE_EMBEDDINGS: "${DEMO_VECTOR_LIVE_EMBEDDINGS:-false}"
      VECTOR_LIVE_INTERVAL_S: "${DEMO_VECTOR_LIVE_INTERVAL_S:-5}"
      VECTOR_LIVE_MAX_PER_CYCLE: "${DEMO_VECTOR_LIVE_MAX_PER_CYCLE:-64}"
      # Optional.  Without a key the backend embeds text locally, so the AI
      # search still works; see backend/app/routes/vector.py.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    networks: [htap-net]
    depends_on:
      - backend
    ports:
      - "4000:80"     # the dashboard: http://localhost:4000
    restart: unless-stopped
