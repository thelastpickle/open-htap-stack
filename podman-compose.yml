name: htap-demo

networks:
  htap-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  kafka-data:


services:

###############################################################################
## Infrastructure Services
###############################################################################

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks: [htap-net]
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # KRaft combined mode (single node, no ZooKeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Two listeners:
      # - Internal Docker/Podman network: kafka:19092 (used by other services)
      # - Host: localhost:9092
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Single-node dev-friendly factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1'"]
      interval: 10s
      timeout: 5s
      retries: 30

  cassandra:
    build:
      context: ./cassandra
    container_name: cassandra
    hostname: cassandra
    networks:
      htap-net:
        ipv4_address: 172.20.0.10
    ports:
      - "9042:9042"
      - "9043:9043"
      # Internode gossip, 7000, is deliberately not published; nothing outside
      # this network needs it on a single-node stack, and on macOS the port is
      # already held by ControlCenter (AirPlay Receiver).
    volumes:
      - ./cassandra-data:/var/lib/cassandra
      - ./cassandra/sidecar.yaml:/config/sidecar.yaml:ro
      - ./cassandra/sidecar-logback.xml:/config/sidecar-logback.xml:ro
    environment:
      CASSANDRA_CLUSTER_NAME: "${CASSANDRA_CLUSTER_NAME:-htap-demo}"
      CASSANDRA_NUM_TOKENS: "${CASSANDRA_NUM_TOKENS:-16}"
      # JVM heap settings to prevent OOM kills
      MAX_HEAP_SIZE: "${CASSANDRA_MAX_HEAP_SIZE:-4G}"
    # Container memory limits (should be higher than MAX_HEAP_SIZE to account for off-heap memory)
    mem_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    memswap_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cqlsh -e \"DESCRIBE KEYSPACES\" cassandra 9042 && curl -f http://localhost:9043/api/v1/__health'>/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  spark:
    # Spark stays on 3.5 because spark-cassandra-connector publishes nothing above 3.5.1,
    # for either Scala version, so Spark 4 would take the spark access path with it.
    # cassandra-analytics is no longer the blocker: CASSANALYTICS-34 is fixed for 0.5.0.
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu

    container_name: spark
    hostname: spark
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Spark master UI
      - "8081:8081"   # Spark worker UI
      - "4040:4040"   # First Spark app UI
      - "10000:10000" # Spark Thrift Server (HiveServer2)
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/ivysettings.xml:/opt/spark/conf/ivysettings.xml:ro
      - ./spark/install-cassandra-libraries.sh:/opt/spark/install-cassandra-libraries.sh:ro
      - ./spark/jobs:/opt/spark/jobs:rw
      - ./cassandra-data:/var/lib/cassandra
      - ./spark/ivy:/opt/spark/work-dir/.ivy2:rw
    environment:
      # Set home directory for Ivy cache (needed for --packages)
      HOME: "/opt/spark/work-dir"
      PATH: "/opt/spark/bin:${PATH}"
      # The CQL connector and the Analytics bulk reader, resolved through the Ivy
      # cache this repository vendors.  Same coordinates as the CI SparkSQL tests.
      CASSANDRA_SPARK_PACKAGES: >-
        com.datastax.spark:spark-cassandra-connector_2.12:3.5.1,
        org.apache.cassandra:cassandra-analytics-core_spark3_2.12:0.4.0,
        org.apache.cassandra:analytics-sidecar-vertx-client-all:0.4.0,
        org.apache.cassandra:cassandra-bridge_spark3_2.12:0.4.0
    command: >
      bash -lc '
        set -euo pipefail;

        echo "Installing Cassandra-compatible JNA with native libraries…";
        wget -q -O /opt/spark/jars/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar;
        echo "1200e7ebeedbe0d10062093f32925a912020e747  /opt/spark/jars/jna.jar" | sha1sum -c - || (echo "SHA1 verification failed!" && exit 1);
        echo "JNA installed and verified successfully";

        echo "Replacing guava-14.0.1.jar with guava-16.0.1…";
        wget -q -O /opt/spark/jars/guava-16.0.1.jar https://repo1.maven.org/maven2/com/google/guava/guava/16.0.1/guava-16.0.1.jar;
        echo "5fa98cd1a63c99a44dd8d3b77e4762b066a5d0c5  /opt/spark/jars/guava-16.0.1.jar" | sha1sum -c - || echo "SHA1 verification failed!";
        rm -f /opt/spark/jars/guava-14.0.1.jar;
        echo "Guava upgraded to 16.0.1 successfully";

        # Put the Cassandra libraries where every classloader in this container can
        # see them.  See spark/install-cassandra-libraries.sh for why the Thrift
        # Server needs that and a one-shot spark-submit does not.
        # Doubled dollar so compose leaves the expansion to the shell.
        /opt/spark/install-cassandra-libraries.sh "$${CASSANDRA_SPARK_PACKAGES}";

        /opt/spark/sbin/start-master.sh --host spark;
        /opt/spark/sbin/start-worker.sh spark://spark:7077;

        # Thrift Server, so the dashboard can run SparkSQL over Cassandra by either
        # path: the CQL connector, and the Analytics bulk reader that reads SSTables
        # directly through the Sidecar.  Both are already on the system classpath by
        # now, so no --packages here: resolving them again would put a second copy
        # on the application classloader.  NOSASL keeps the wire protocol plain, so
        # clients need no SASL library.
        #
        # Two things keep this long-lived server from monopolising the cluster it
        # shares.  Its Derby metastore is its own, because Derby admits one JVM at a
        # time and a server holding the default one would stop anybody running
        # spark-sql in this container, which the CI does.  And spark.cores.max caps
        # what it takes from the worker: a standalone application otherwise holds
        # every core for its lifetime, and the next job to arrive waits for ever
        # with "Initial job has not accepted any resources".  Half the cores, not a
        # fixed two: a fixed cap silently throttles the analytical paths on any host
        # bigger than the smallest one, and measured here a hard 2 made the same
        # aggregate take 130s where half the box took 53s.  The long keepAlive holds the Cassandra
        # session of the connector open between queries: the dashboard queries in
        # bursts, and rebuilding a driver session per burst would cost time and add
        # a failure mode for nothing.
        # Two things to mind when editing this block, both of which fail quietly.
        # It is one single-quoted shell string, so an apostrophe anywhere in it,
        # comments included, ends the string and truncates the script.  And compose
        # interpolates a dollar-brace reference anywhere in this file, comments
        # included, so a variable meant for the shell needs its dollar doubled.
        # A core here is a concurrent task, and a bulk-reader task spends most of
        # its life waiting on the Sidecar rather than computing: measured on a
        # seven-core laptop, this container sat at a tenth of a core while its tasks
        # streamed.  So the cap sets how many streams there are, and half the box
        # left most of the throughput unused: the same scan of the whole history
        # took 443s on three cores and 348s on five.  Leave two cores for everything
        # else instead, and fall back to half on a small host so a four-core CI
        # runner still keeps two for the spark-sql jobs it runs beside this server.
        if [ "$$(nproc)" -gt 4 ]; then THRIFT_CORES=$$(( $$(nproc) - 2 ));
        else THRIFT_CORES=$$(( $$(nproc) / 2 )); fi;
        if [ "$${THRIFT_CORES}" -lt 2 ]; then THRIFT_CORES=2; fi;
        echo "Starting the Spark Thrift Server on 10000, with $${THRIFT_CORES} of $$(nproc) cores…";
        /opt/spark/sbin/start-thriftserver.sh --master spark://spark:7077 --hiveconf "javax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/tmp/thriftserver-metastore;create=true" --hiveconf hive.server2.authentication=NOSASL --hiveconf hive.server2.thrift.port=10000 --hiveconf hive.server2.thrift.bind.host=0.0.0.0 --conf spark.cassandra.connection.host=cassandra --conf spark.cassandra.connection.port=9042 --conf "spark.cores.max=$${THRIFT_CORES}" --conf "spark.executor.cores=$${THRIFT_CORES}" --conf spark.cassandra.connection.keepAliveMS=3600000;

        tail -F /opt/spark/logs/* || tail -f /dev/null
      '
    # tips for debugging: check /opt/spark/work/*/*/stderr

  presto:
    image: prestodb/presto:0.298.1
    container_name: presto
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
      spark:
        condition: service_started
    ports:
      - "8088:8080" # PrestoDB UI
    volumes:
      - ./presto/etc:/opt/presto-server/etc:ro
      # Placeholder for your custom Sidecar/SSTable connector plugin JAR(s)
      #- ./presto/plugin/sstable:/opt/presto-server/plugin/sstable:rw


###############################################################################
## Demo Application Services
###############################################################################

  data-producer:
    build:
      context: ./ingress/producer
    container_name: data-producer
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      # Starting fleet size and rate.  The dashboard's Settings page can change
      # both at runtime, up to MAX_ENTITIES.  The default rate is one the sink
      # sustains on a laptop: it writes three rows per event at QUORUM, so it is
      # the narrower end of the pipe, and a producer that outruns it turns a live
      # demo into a growing Kafka backlog.
      N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-2000}"
      OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      PRODUCER_CLIENT_ID: "demo-producer"
      # Live demo controls.  Unset this to ignore the dashboard entirely.
      SETTINGS_URL: "http://backend:8000/api/settings/demo"
      SETTINGS_POLL_INTERVAL_S: "${DEMO_SETTINGS_POLL_INTERVAL_S:-10}"
    restart: unless-stopped

  data-cassandra-sink:
    build:
      context: ./ingress/consumer
    container_name: data-cassandra-sink
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      GROUP_ID: "${DEMO_GROUP_ID:-demo-cassandra-sink}"
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      TABLE: "${DEMO_TABLE:-events}"
      BATCH_SIZE: "${DEMO_BATCH_SIZE:-200}"
      # How events are partitioned.  Declared once here because the dashboard's
      # backend has to name the same buckets and shards when it queries them; the
      # two reading different values would produce queries that match nothing.
      EVENT_BUCKET_MINUTES: "${DEMO_EVENT_BUCKET_MINUTES:-15}"
      EVENT_SHARDS: "${DEMO_EVENT_SHARDS:-16}"
    restart: unless-stopped


###############################################################################
## Mission Control dashboard
##
## The dashboard is the demo's front end: one API over all five access paths, and a
## web UI on top of it.  Nothing else in the stack depends on either service, so
## both can be stopped without affecting ingest.
###############################################################################

  backend:
    build:
      # The root, not ./backend, because the image also builds the cqlite reader
      # from cqlite-datafusion/ into a wheel.  .dockerignore excludes everything
      # except those two directories, so the context stays small.
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "8000:8000"   # REST API and OpenAPI docs at /docs
    volumes:
      # The cqlite path parses these files in place, with no snapshot and no
      # Sidecar.  Read-only because a reader must never be able to corrupt the
      # dataset the other four paths are reading; Cassandra mounts the same host
      # directory read-write, and the spark service mounts it too.
      - ./cassandra-data:/var/lib/cassandra:ro
    environment:
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      # The same two values the sink writes with, so the window the compare page
      # offers names partitions that exist.
      EVENT_BUCKET_MINUTES: "${DEMO_EVENT_BUCKET_MINUTES:-15}"
      EVENT_SHARDS: "${DEMO_EVENT_SHARDS:-16}"
      PRESTO_HOST: "presto"
      PRESTO_PORT: "8080"
      SPARK_THRIFT_HOST: "spark"
      SPARK_THRIFT_PORT: "10000"
      KAFKA_HOST: "kafka"
      KAFKA_PORT: "19092"
      SPARK_UI_HOST: "spark"
      SPARK_UI_PORT: "8080"
      # Where the cqlite reader looks for the keyspace directories.  Stated here
      # rather than left to the backend's default, because it and the read-only
      # mount above are one setting: the two disagreeing gives a path that finds
      # no table directory and reports every query as a decline.
      CQLITE_DATA_DIR: "/var/lib/cassandra/data"
      # How many token-ring slices a scan with no WHERE divides into.  One, and
      # reachable from here so the split can be exercised without a rebuild: the
      # reader applies the token bound itself, because cqlite's BTI route drops
      # it, and that is worth being able to check.  Raising it multiplies memory
      # rather than throughput; see backend/app/config.py for the measured
      # figure that keeps it at one.
      CQLITE_SPLITS: "${CQLITE_SPLITS:-1}"
      # Shown as the startup defaults on the Settings page, so they must match
      # what data-producer above was started with.
      DEMO_N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      DEMO_MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      DEMO_EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-2000}"
      DEMO_OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      # Whether the vector index follows the snippets the sink writes, and how
      # often.  Off at startup: the Explore page turns it on, and the reason to
      # turn it on there is to watch the point read on the Health page stay where
      # it was while the embedder works, which is not visible if it was already
      # running.  The loop reads the snippets after the sink has written them, so
      # nothing in the write path waits for an embedding.
      VECTOR_LIVE_EMBEDDINGS: "${DEMO_VECTOR_LIVE_EMBEDDINGS:-false}"
      VECTOR_LIVE_INTERVAL_S: "${DEMO_VECTOR_LIVE_INTERVAL_S:-5}"
      VECTOR_LIVE_MAX_PER_CYCLE: "${DEMO_VECTOR_LIVE_MAX_PER_CYCLE:-64}"
      # Optional.  Without a key the backend embeds text locally, so the AI
      # search still works; see backend/app/routes/vector.py.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    networks: [htap-net]
    depends_on:
      - backend
    ports:
      - "4000:80"     # the dashboard: http://localhost:4000
    restart: unless-stopped
