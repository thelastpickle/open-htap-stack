name: htap-demo

networks:
  htap-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  kafka-data:


services:

###############################################################################
## Infrastructure Services
###############################################################################

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    networks: [htap-net]
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # KRaft combined mode (single node, no ZooKeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Two listeners:
      # - Internal Docker/Podman network: kafka:19092 (used by other services)
      # - Host: localhost:9092
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Single-node dev-friendly factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1'"]
      interval: 10s
      timeout: 5s
      retries: 30

  cassandra:
    build:
      context: ./cassandra
    container_name: cassandra
    hostname: cassandra
    networks:
      htap-net:
        ipv4_address: 172.20.0.10
    ports:
      - "9042:9042"
      - "9043:9043"
      - "7000:7000"
    volumes:
      - ./cassandra-data:/var/lib/cassandra
      - ./cassandra/sidecar.yaml:/config/sidecar.yaml:ro
      - ./cassandra/sidecar-logback.xml:/config/sidecar-logback.xml:ro
    environment:
      CASSANDRA_CLUSTER_NAME: "${CASSANDRA_CLUSTER_NAME:-htap-demo}"
      CASSANDRA_NUM_TOKENS: "${CASSANDRA_NUM_TOKENS:-16}"
      # JVM heap settings to prevent OOM kills
      MAX_HEAP_SIZE: "${CASSANDRA_MAX_HEAP_SIZE:-4G}"
    # Container memory limits (should be higher than MAX_HEAP_SIZE to account for off-heap memory)
    mem_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    memswap_limit: "${CASSANDRA_MEM_LIMIT:-8g}"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cqlsh -e \"DESCRIBE KEYSPACES\" cassandra 9042 && curl -f http://localhost:9043/api/v1/__health'>/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  spark:
    # cassandra-analytics does not support spark 4 yet, ref CASSANALYTICS-34
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu

    container_name: spark
    hostname: spark
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Spark master UI
      - "8081:8081"   # Spark worker UI
      - "4040:4040"   # First Spark app UI
      - "10000:10000" # Spark Thrift Server (HiveServer2)
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/ivysettings.xml:/opt/spark/conf/ivysettings.xml:ro
      - ./spark/jobs:/opt/spark/jobs:rw
      - ./cassandra-data:/var/lib/cassandra
      - ./spark/ivy:/opt/spark/work-dir/.ivy2:rw
    environment:
      # Set home directory for Ivy cache (needed for --packages)
      HOME: "/opt/spark/work-dir"
      PATH: "/opt/spark/bin:${PATH}"
    command: >
      bash -lc '
        set -euo pipefail;

        echo "Installing Cassandra-compatible JNA with native libraries…";
        wget -q -O /opt/spark/jars/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar;
        echo "1200e7ebeedbe0d10062093f32925a912020e747  /opt/spark/jars/jna.jar" | sha1sum -c - || (echo "SHA1 verification failed!" && exit 1);
        echo "JNA installed and verified successfully";

        echo "Replacing guava-14.0.1.jar with guava-16.0.1…";
        wget -q -O /opt/spark/jars/guava-16.0.1.jar https://repo1.maven.org/maven2/com/google/guava/guava/16.0.1/guava-16.0.1.jar;
        echo "5fa98cd1a63c99a44dd8d3b77e4762b066a5d0c5  /opt/spark/jars/guava-16.0.1.jar" | sha1sum -c - || echo "SHA1 verification failed!";
        rm -f /opt/spark/jars/guava-14.0.1.jar;
        echo "Guava upgraded to 16.0.1 successfully";

        /opt/spark/sbin/start-master.sh --host spark;
        /opt/spark/sbin/start-worker.sh spark://spark:7077;

        # Thrift Server, so the dashboard can run SparkSQL over Cassandra.
        # --packages resolves the Cassandra connector through the Ivy cache this
        # repository vendors, the same way the CI SparkSQL tests do.  NOSASL keeps
        # the wire protocol plain, so clients need no SASL library.  The long
        # keepAlive holds the Cassandra session of the connector open between
        # queries: the dashboard queries in bursts, and rebuilding a driver
        # session per burst would cost time and add a failure mode for nothing.
        # Mind the quoting: this whole block is one single-quoted shell string,
        # so an apostrophe anywhere in it — including in a comment — ends the
        # string and silently truncates the script.
        echo "Starting the Spark Thrift Server on 10000…";
        /opt/spark/sbin/start-thriftserver.sh --master spark://spark:7077 --packages com.datastax.spark:spark-cassandra-connector_2.12:3.5.1 --hiveconf hive.server2.authentication=NOSASL --hiveconf hive.server2.thrift.port=10000 --hiveconf hive.server2.thrift.bind.host=0.0.0.0 --conf spark.cassandra.connection.host=cassandra --conf spark.cassandra.connection.port=9042 --conf spark.cassandra.connection.keepAliveMS=3600000;

        tail -F /opt/spark/logs/* || tail -f /dev/null
      '
    # tips for debugging: check /opt/spark/work/*/*/stderr

  presto:
    image: prestodb/presto:0.296
    container_name: presto
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
      spark:
        condition: service_started
    ports:
      - "8088:8080" # PrestoDB UI
    volumes:
      - ./presto/etc:/opt/presto-server/etc:ro
      # Placeholder for your custom Sidecar/SSTable connector plugin JAR(s)
      #- ./presto/plugin/sstable:/opt/presto-server/plugin/sstable:rw


###############################################################################
## Demo Application Services
###############################################################################

  data-producer:
    build:
      context: ./ingress/producer
    container_name: data-producer
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      # Starting fleet size and rate.  The dashboard's Settings page can change
      # both at runtime, up to MAX_ENTITIES.  The default rate is one the sink
      # sustains on a laptop: it writes three rows per event at QUORUM, so it is
      # the narrower end of the pipe, and a producer that outruns it turns a live
      # demo into a growing Kafka backlog.
      N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-2000}"
      OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      PRODUCER_CLIENT_ID: "demo-producer"
      # Live demo controls.  Unset this to ignore the dashboard entirely.
      SETTINGS_URL: "http://backend:8000/api/settings/demo"
      SETTINGS_POLL_INTERVAL_S: "${DEMO_SETTINGS_POLL_INTERVAL_S:-10}"
    restart: unless-stopped

  data-cassandra-sink:
    build:
      context: ./ingress/consumer
    container_name: data-cassandra-sink
    networks: [htap-net]
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC: "${DEMO_TOPIC:-demo-events}"
      GROUP_ID: "${DEMO_GROUP_ID:-demo-cassandra-sink}"
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      TABLE: "${DEMO_TABLE:-events}"
      BATCH_SIZE: "${DEMO_BATCH_SIZE:-200}"
    restart: unless-stopped


###############################################################################
## Mission Control dashboard
##
## The dashboard is the demo's front end: one API over all three engines, and a
## web UI on top of it.  Nothing else in the stack depends on either service, so
## both can be stopped without affecting ingest.
###############################################################################

  backend:
    build:
      context: ./backend
    container_name: backend
    networks: [htap-net]
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "8000:8000"   # REST API and OpenAPI docs at /docs
    environment:
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: "${DEMO_KEYSPACE:-demo}"
      PRESTO_HOST: "presto"
      PRESTO_PORT: "8080"
      SPARK_THRIFT_HOST: "spark"
      SPARK_THRIFT_PORT: "10000"
      KAFKA_HOST: "kafka"
      KAFKA_PORT: "19092"
      SPARK_UI_HOST: "spark"
      SPARK_UI_PORT: "8080"
      # Shown as the startup defaults on the Settings page, so they must match
      # what data-producer above was started with.
      DEMO_N_ENTITIES: "${DEMO_N_ENTITIES:-100}"
      DEMO_MAX_ENTITIES: "${DEMO_MAX_ENTITIES:-2000}"
      DEMO_EVENTS_PER_SEC: "${DEMO_EVENTS_PER_SEC:-2000}"
      DEMO_OUTLIER_PERCENT: "${DEMO_OUTLIER_PERCENT:-5.0}"
      # Optional.  Without a key the backend embeds text locally, so the AI
      # search still works; see backend/app/routes/vector.py.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    networks: [htap-net]
    depends_on:
      - backend
    ports:
      - "4000:80"     # the dashboard: http://localhost:4000
    restart: unless-stopped
