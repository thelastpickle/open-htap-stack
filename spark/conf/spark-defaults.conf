spark.master                     spark://spark:7077

# Keep releaseVersion equal to the tarball in cassandra/Dockerfile.  Cassandra Analytics
# selects its bridge on the major and minor only, so 5.0.x picks five-zero; the patch number
# is here so a mismatch is visible rather than silently tolerated.
spark.driver.extraJavaOptions     -Dcassandra.releaseVersion=5.0.9 -Dcassandra.analytics.bridges.sstable_format=bti
spark.executor.extraJavaOptions   -Dcassandra.releaseVersion=5.0.9 -Dcassandra.analytics.bridges.sstable_format=bti

# Ivy cache configuration for --packages
spark.jars.ivy                    /opt/spark/work-dir/.ivy2

spark.sql.warehouse.dir /tmp/spark-warehouse
javax.jdo.option.ConnectionURL jdbc:derby:;databaseName=/tmp/metastore_db;create=true

# cassandra spark bulk writer needs KryoSerializer
spark.serializer    org.apache.spark.serializer.KryoSerializer